name: Validate Google Scholar Crawler

on:
  push:
    branches:
      - main
    paths:
      - google_scholar_crawler/**
      - deploy/**
      - .github/workflows/google_scholar_stats.yml
  pull_request:
    paths:
      - google_scholar_crawler/**
      - deploy/**
      - .github/workflows/google_scholar_stats.yml
  workflow_dispatch:

# Production fetching and publishing run on the ECS systemd timer.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt
          python -m pip check

      - name: Verify crawler failure handling and deployment publication
        run: |
          python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
          python -m unittest discover -s deploy/scholar -p 'test_*.py'
